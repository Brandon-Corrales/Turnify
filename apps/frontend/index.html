<!doctype html>
<html lang="es">
  <head>
    <!-- Widget de accesibilidad UserWay (requisito del docente, Seguimiento #3).
         Va como PRIMERA entrada del <head>, como indica UserWay. No se monta
         desde JSX: verificado en navegador real que React 19 inserta un
         <script> renderizado en el cliente sin ejecutarlo, y el widget nunca
         carga. El data-account no es un secreto (es visible en cualquier
         página que use el widget), por eso no va en variables de entorno.
         data-position="4" (abajo al centro), elegido tras medirlo en navegador
         real: la esquina por defecto (arriba a la derecha) cae sobre los
         controles de tema/idioma del header en mobile y sobre los toasts;
         abajo a la derecha está el chatbot; abajo a la izquierda, los
         controles del sidebar del admin; y al centro-derecha tapaba el borde
         de inputs y tarjetas en mobile (ej. Contraseña en Login). -->
    <script
      src="https://cdn.userway.org/widget.js"
      data-account="f0W3dnHKyc"
      data-position="4"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título inicial; cada pantalla lo cambia con useTituloPagina (Bloque 1, punto 1.6). -->
    <title>Turnify</title>
    <meta
      name="description"
      content="Turnify: agenda de citas para negocios de servicios. Reservas en línea, calendario, recordatorios por correo y WhatsApp, y reportes."
    />
    <!-- Íconos generados a partir del logo oficial (public/turnify-logo.png, 1024 px).
         No hay versión SVG de este logo: el favicon.svg anterior era otro diseño. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172b" />
    <!-- Open Graph y Twitter. og-image.png: 1200×630 (el tamaño que piden
         Facebook/LinkedIn/X para la vista grande), logo centrado sobre su índigo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turnify" />
    <meta property="og:title" content="Turnify — agenda de citas para tu negocio" />
    <meta
      property="og:description"
      content="Reservas en línea, calendario, recordatorios por correo y WhatsApp, y reportes para negocios de servicios."
    />
    <meta property="og:url" content="https://turnify-frontend-i0kl.onrender.com" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://turnify-frontend-i0kl.onrender.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Turnify: calendario con una marca de verificación" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://turnify-frontend-i0kl.onrender.com/og-image.png" />
    <meta name="twitter:image:alt" content="Logo de Turnify: calendario con una marca de verificación" />
    <meta name="twitter:title" content="Turnify — agenda de citas para tu negocio" />
    <meta
      name="twitter:description"
      content="Reservas en línea, calendario, recordatorios por correo y WhatsApp, y reportes para negocios de servicios."
    />
    <script>
      // Aplica el tema ANTES de que React monte (punto 9 del brief: tema
      // persistente, sistema operativo como default la primera vez) para
      // que no haya parpadeo de claro→oscuro en la primera pintura.
      (function () {
        try {
          var guardado = localStorage.getItem('turnify_tema');
          var oscuro = guardado
            ? guardado === 'oscuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', oscuro);
        } catch (e) {}
      })();
      // <html lang> con el idioma elegido ANTES de que UserWay se
      // inicialice: su app carga async y solo lee `lang` al arrancar, así
      // que no puede esperar a que React (módulo diferido) lo corrija.
      // Mismo criterio que src/i18n/config.ts: preferencia guardada
      // (turnify_idioma) y si no hay, idioma del navegador; español por
      // defecto.
      (function () {
        try {
          var idioma = localStorage.getItem('turnify_idioma');
          if (idioma !== 'es' && idioma !== 'en') {
            idioma = /^en\b/i.test(navigator.language) ? 'en' : 'es';
          }
          document.documentElement.lang = idioma;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-live="polite"
        id="cargador-raiz"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f8fafc;
          color: #0f172a;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        "
      >
        <style>
          .dark #cargador-raiz {
            background-color: #0f172a !important;
            color: #f8fafc !important;
          }
          @keyframes giro-carga-raiz {
            to {
              transform: rotate(360deg);
            }
          }
          .spinner-carga-raiz {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(79, 70, 229, 0.2);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: giro-carga-raiz 0.8s linear infinite;
          }
          .dark .spinner-carga-raiz {
            border-color: rgba(99, 102, 241, 0.2);
            border-top-color: #818cf8;
          }
          html[lang='en'] .texto-es,
          html:not([lang='en']) .texto-en {
            display: none !important;
          }
        </style>
        <div class="spinner-carga-raiz" aria-hidden="true"></div>
        <p class="texto-es" style="margin-top: 16px; font-size: 15px; font-weight: 500;">
          Cargando Turnify…
        </p>
        <p class="texto-en" style="margin-top: 16px; font-size: 15px; font-weight: 500;">
          Loading Turnify…
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
