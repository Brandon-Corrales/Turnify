name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Verificación de tipos TypeScript
        run: |
          npx tsc -b apps/frontend
          npx tsc --noEmit -p apps/backend

      - name: Pruebas unitarias Frontend
        run: npm test --workspace=apps/frontend

      - name: Pruebas unitarias Backend
        run: npm test --workspace=apps/backend -- --exclude "**/*.integration.spec.ts"

      - name: Compilación de producción
        run: |
          npm run build --workspace=apps/frontend
          npm run build --workspace=apps/backend
